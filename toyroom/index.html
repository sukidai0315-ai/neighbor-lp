<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1a1511">
  <title>toyroom</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="app" class="pre">
    <canvas id="view"></canvas>
    <div class="vignette"></div>
    <div class="bar top"></div><div class="bar bottom"></div>

    <div class="hud" id="hud">
      <span class="mode" id="modeTag">あるく</span>
      <span class="keys">WASD 移動 ／ Space ジャンプ ／ Shift スケボー ／ E はなす ／ ドラッグ カメラ</span>
    </div>

    <div class="prompt" id="prompt"><span id="promptText">はなす</span><kbd>E</kbd></div>
    <div class="subtitle" id="subtitle"><span class="who" id="who"></span><span id="line"></span></div>
    <div class="choices" id="choices"></div>

    <div class="touch" id="touch">
      <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
      <div class="tbtns">
        <button type="button" id="tTalk" class="hiddenBtn">はなす</button>
        <button type="button" id="tSkate">スケボー</button>
        <button type="button" id="tJump">ジャンプ</button>
      </div>
    </div>

    <div class="rotate" id="rotate"><div>スマホを よこに してね</div></div>
    <div class="fade" id="fade"></div>
    <div class="ending" id="ending" hidden>
      <div class="endingInner">
        <div class="titleEyebrow">体験版は ここまで</div>
        <h1>toyroom</h1>
        <p id="endingNote">あの子は、あさ、まくらもとの しょうを みつけて わらった。<br>だれが なおしたかは、しらないまま。</p>
        <button type="button" id="againBtn">もういちど</button>
      </div>
    </div>

    <div class="title" id="title">
      <div class="titleInner">
        <div class="titleEyebrow">体験版 開発中 / phase 5-3</div>
        <h1>toyroom</h1>
        <p>よるの こどもべやで、たからものを さがす。</p>
        <button type="button" id="startBtn">はじめる</button>
        <p class="small">PC: WASD で移動、Space でジャンプ、Shift でスケボー、E で会話<br>スマホ: 横画面で、左のスティックと右のボタン</p>
      </div>
    </div>

    <div class="debug" id="debug" hidden>
      <label>距離 <input type="range" id="dbgDist" min="2.5" max="8" step="0.1" value="4.6"></label>
      <label>角度 <input type="range" id="dbgPitch" min="0.05" max="0.7" step="0.01" value="0.3"></label>
      <label>画角 <input type="range" id="dbgFov" min="35" max="70" step="1" value="50"></label>
      <label>回り込み <input type="range" id="dbgFollow" min="0" max="3" step="0.1" value="1.4"></label>
      <span id="dbgStats"></span>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
